        const { useState, useEffect, useMemo, useRef } = React;
        const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer } = window.Recharts;

        const BASE_RATING = 1200;
        const K_FACTOR = 32;

        const formatId = (id) => String(id).padStart(6, '0');
        const calculateExpected = (ratingA, ratingB) => 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
        const calculateEloChange = (result, expected) => Math.round(K_FACTOR * (result - expected));

        const calculateCurrentStats = (basePlayers, matches) => {
          const stats = {};
          basePlayers.forEach(p => { stats[p.id] = { ...p, rating: BASE_RATING, wins: 0, draws: 0, losses: 0, matchCount: 0 }; });

          const sortedMatches = [...matches].sort((a, b) => a.timestamp - b.timestamp);
          sortedMatches.forEach(m => {
            const w = stats[m.whiteId]; const b = stats[m.blackId];
            if (!w || !b) return;

            const expectedW = calculateExpected(w.rating, b.rating);
            const changeW = calculateEloChange(m.result, expectedW);
            
            w.rating += changeW; b.rating += (-changeW);
            w.matchCount++; b.matchCount++;

            if (m.result === 1) { w.wins++; b.losses++; }
            else if (m.result === 0) { w.losses++; b.wins++; }
            else { w.draws++; b.draws++; }
          });

          const playersArr = Object.values(stats);
          const activePlayers = playersArr.filter(p => p.matchCount > 0);
          const inactivePlayers = playersArr.filter(p => p.matchCount === 0);

          activePlayers.sort((a, b) => b.rating - a.rating || b.matchCount - a.matchCount);
          
          let rank = 1;
          const rankedActive = activePlayers.map(p => ({ ...p, rank: rank++, winRate: ((p.wins + p.draws*0.5) / p.matchCount * 100).toFixed(1) }));
          const unrankedInactive = inactivePlayers.map(p => ({ ...p, rank: '-', winRate: '0.0' }));

          return [...rankedActive, ...unrankedInactive];
        };

        const FilterPlayerSelector = ({ label, players, selectedId, onSelect }) => {
          const [selectedGrade, setSelectedGrade] = useState('');
          const [selectedClass, setSelectedClass] = useState('');

          const grades = [...new Set(players.map(p => p.grade))].sort((a, b) => Number(a) - Number(b));
          const classes = selectedGrade ? [...new Set(players.filter(p => p.grade === selectedGrade).map(p => p.classNum))].sort((a, b) => Number(a) - Number(b)) : [];
          const availablePlayers = selectedClass ? players.filter(p => p.grade === selectedGrade && p.classNum === selectedClass) : [];

          useEffect(() => {
            if (!selectedId) { setSelectedGrade(''); setSelectedClass(''); }
          }, [selectedId]);

          return (
            <div className="flex flex-col gap-1.5 w-full">
              <span className="text-xs font-bold text-gray-600">{label} 선수</span>
              <div className="flex gap-2">
                <select className="border border-gray-300 rounded-md p-1.5 text-sm outline-none bg-white flex-1" value={selectedGrade} onChange={(e) => { setSelectedGrade(e.target.value); setSelectedClass(''); onSelect(''); }}>
                  <option value="">전체 학년</option>
                  {grades.map(g => <option key={g} value={g}>{g}학년</option>)}
                </select>
                <select className="border border-gray-300 rounded-md p-1.5 text-sm outline-none bg-white flex-1 disabled:bg-gray-100 disabled:text-gray-400" value={selectedClass} onChange={(e) => { setSelectedClass(e.target.value); onSelect(''); }} disabled={!selectedGrade}>
                  <option value="">전체 반</option>
                  {classes.map(c => <option key={c} value={c}>{c}반</option>)}
                </select>
                <select className="border border-gray-300 rounded-md p-1.5 text-sm outline-none bg-white flex-1 disabled:bg-gray-100 disabled:text-gray-400" value={selectedId} onChange={(e) => onSelect(e.target.value)} disabled={!selectedClass}>
                  <option value="">전체 이름</option>
                  {availablePlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
            </div>
          );
        };

        const PlayerSelector = ({ label, players, selectedId, onSelect }) => {
          const [selectedGrade, setSelectedGrade] = useState('');
          const [selectedClass, setSelectedClass] = useState('');
          
          const selectedPlayer = players.find(p => p.id === selectedId);
          const grades = [...new Set(players.map(p => p.grade))].sort((a, b) => Number(a) - Number(b));
          const classes = [...new Set(players.filter(p => p.grade === selectedGrade).map(p => p.classNum))].sort((a, b) => Number(a) - Number(b));
          const availablePlayers = players.filter(p => p.grade === selectedGrade && p.classNum === selectedClass);

          useEffect(() => {
            if (!selectedId) { setSelectedGrade(''); setSelectedClass(''); } 
            else if (selectedPlayer) { setSelectedGrade(selectedPlayer.grade); setSelectedClass(selectedPlayer.classNum); }
          }, [selectedId, selectedPlayer]);

          return (
            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-sm">
              <h3 className="font-bold text-gray-700 mb-3 flex items-center gap-2">
                <div className={`w-4 h-4 rounded-full shadow-inner ${label === '백' ? 'bg-white border border-gray-300' : 'bg-gray-800'}`}></div>
                {label} 선수 선택
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <select className="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white" value={selectedGrade} onChange={(e) => { setSelectedGrade(e.target.value); setSelectedClass(''); onSelect(''); }}>
                  <option value="">학년</option>
                  {grades.map(g => <option key={g} value={g}>{g}학년</option>)}
                </select>
                <select className="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white disabled:bg-gray-100 disabled:text-gray-400" value={selectedClass} onChange={(e) => { setSelectedClass(e.target.value); onSelect(''); }} disabled={!selectedGrade}>
                  <option value="">반</option>
                  {classes.map(c => <option key={c} value={c}>{c}반</option>)}
                </select>
                <select className="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white disabled:bg-gray-100 disabled:text-gray-400" value={selectedId} onChange={(e) => onSelect(e.target.value)} disabled={!selectedClass}>
                  <option value="">이름 (선택)</option>
                  {availablePlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              {selectedPlayer && (
                <div className="mt-3 text-sm text-blue-900 bg-blue-50 border border-blue-100 p-2.5 rounded-md flex justify-between items-center">
                  <span className="font-medium">{selectedPlayer.grade}학년 {selectedPlayer.classNum}반 {selectedPlayer.name}</span>
                  <span className="font-bold font-mono bg-white px-2 py-1 rounded shadow-sm text-blue-700">ELO: {selectedPlayer.rating}</span>
                </div>
              )}
            </div>
          );
        };

        const CustomBarTooltip = ({ active, payload, label }) => {
          if (active && payload && payload.length) {
            const data = payload[0].payload;
            return (
              <div className="bg-white p-4 rounded-xl shadow-lg border border-gray-100 text-sm min-w-[150px]">
                <p className="font-extrabold text-gray-800 mb-3 border-b border-gray-100 pb-2">{data.rawName} 전적</p>
                {payload.map(entry => (
                  <div key={entry.name} className="flex justify-between items-center gap-4 mb-1.5">
                    <span style={{ color: entry.color }} className="font-bold flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: entry.color }}></span>
                      {entry.name}
                    </span>
                    <span className="font-bold text-gray-700">{entry.value}건</span>
                  </div>
                ))}
                <div className="mt-3 pt-3 border-t border-gray-100 flex justify-between items-center gap-4">
                  <span className="font-bold text-blue-800">승률</span>
                  <span className="font-black text-blue-700 text-base">{data.승률}%</span>
                </div>
              </div>
            );
          }
          return null;
        };

        function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          
          const [basePlayers, setBasePlayers] = useState(() => JSON.parse(localStorage.getItem('chess_players') || '[]'));
          const [matches, setMatches] = useState(() => JSON.parse(localStorage.getItem('chess_matches') || '[]'));
          const [leagueTitle, setLeagueTitle] = useState(() => localStorage.getItem('chess_title') || '우리 반 체스리그');
          
          const [isAdmin, setIsAdmin] = useState(false);
          const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem('chess_admin_pwd') || '1234');
          const [isPwdModalOpen, setIsPwdModalOpen] = useState(false);
          const [newPwdInput, setNewPwdInput] = useState('');
          
          const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
          const [loginPwdInput, setLoginPwdInput] = useState('');
          
          const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem('chess_sync_url') || '');
          const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
          const [tempSyncUrl, setTempSyncUrl] = useState(() => localStorage.getItem('chess_sync_url') || '');
          const [isSyncing, setIsSyncing] = useState(false);

          const [isEditingTitle, setIsEditingTitle] = useState(false);
          const [tempTitle, setTempTitle] = useState('');
          const allMatchTypes = ['자유', '스탠다드', '래피드', '블리츠', '불렛'];
          const [showFilter, setShowFilter] = useState(false);
          const [filter, setFilter] = useState({ period: '전체 기간', startDate: '', endDate: '', types: allMatchTypes, whiteId: '', blackId: '' });
          const [infoTabPlayerId, setInfoTabPlayerId] = useState('');
          const [infoPeriod, setInfoPeriod] = useState('1년');
          const [toast, setToast] = useState(null);
          const [confirmModal, setConfirmModal] = useState({ isOpen: false, message: '', onConfirm: null });
          
          const gradeInputRef = useRef(null);
          const fileInputRef = useRef(null);

          const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };
          const showConfirm = (message, onConfirm) => { setConfirmModal({ isOpen: true, message, onConfirm }); };

          // 앱 시작 시 클라우드 동기화 (캐시 방지 적용)
          useEffect(() => {
            const savedUrl = localStorage.getItem('chess_sync_url');
            if (!savedUrl) return;

            const loadCloudData = async () => {
              try {
                const res = await fetch(savedUrl, { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                const isCloudEmpty = !data.players || data.players.length === 0;
                const localPlayers = JSON.parse(localStorage.getItem('chess_players') || '[]');
                const isLocalEmpty = localPlayers.length === 0;

                // [핵심 방어] 클라우드가 비어있는데 로컬에 데이터가 있으면 덮어쓰지 않고 보존
                if (isCloudEmpty && !isLocalEmpty) {
                  return;
                }
                
                if (data.players) setBasePlayers(data.players);
                if (data.matches) setMatches(data.matches);
                if (data.title) setLeagueTitle(data.title);
                
              } catch (err) {
                console.error('클라우드 자동 동기화 실패:', err);
              }
            };
            loadCloudData();
          }, []);

          // 데이터 변경 시 로컬 저장 및 관리자 모드일 경우 클라우드에 자동 푸시
          useEffect(() => {
            localStorage.setItem('chess_players', JSON.stringify(basePlayers));
            localStorage.setItem('chess_matches', JSON.stringify(matches));
            localStorage.setItem('chess_title', leagueTitle);

            if (isAdmin && syncUrl) {
              setIsSyncing(true);
              fetch(syncUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ title: leagueTitle, players: basePlayers, matches: matches })
              })
              .then(() => setIsSyncing(false))
              .catch(err => { console.error("Cloud sync failed:", err); setIsSyncing(false); });
            }
          }, [basePlayers, matches, leagueTitle, syncUrl, isAdmin]);

          // 클라우드 동기화 수동 설정 버튼 핸들러
          const handleSaveSyncUrl = async () => {
            setSyncUrl(tempSyncUrl);
            localStorage.setItem('chess_sync_url', tempSyncUrl);
            setIsSyncModalOpen(false);
            
            if (tempSyncUrl) {
              try {
                showToast('클라우드 상태 확인 중...');
                const res = await fetch(tempSyncUrl, { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                const isCloudEmpty = !data.players || data.players.length === 0;
                const isLocalEmpty = basePlayers.length === 0;

                // 클라우드가 비어있고 로컬에 데이터가 있으면 -> 로컬 데이터를 클라우드로 밀어넣기
                if (isCloudEmpty && !isLocalEmpty) {
                  setIsSyncing(true);
                  await fetch(tempSyncUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ title: leagueTitle, players: basePlayers, matches: matches })
                  });
                  setIsSyncing(false);
                  showToast('로컬 데이터를 클라우드에 성공적으로 백업했습니다!');
                } else {
                  // 그 외의 경우 (클라우드에 데이터가 있거나 둘 다 비어있을 때) -> 클라우드 데이터를 로컬에 덮어쓰기
                  if (data.players) setBasePlayers(data.players);
                  if (data.matches) setMatches(data.matches);
                  if (data.title) setLeagueTitle(data.title);
                  showToast('클라우드 데이터를 로컬에 동기화했습니다!');
                }
              } catch (err) {
                setIsSyncing(false);
                showToast('동기화 주소가 잘못되었거나 접근할 수 없습니다.', 'error');
              }
            }
          };

          const handleToggleAdmin = () => {
            if (isAdmin) {
              setIsAdmin(false);
              if (activeTab === 'addMatch' || activeTab === 'players') setActiveTab('dashboard');
              showToast('읽기 전용 뷰어 모드로 전환되었습니다.');
            } else {
              setIsLoginModalOpen(true);
            }
          };

          const handleLoginSubmit = () => {
            if (loginPwdInput === adminPassword) {
              setIsAdmin(true);
              setIsLoginModalOpen(false);
              setLoginPwdInput('');
              showToast('관리자 모드가 활성화되었습니다. 모든 편집이 가능합니다.');
            } else {
              showToast('비밀번호가 틀렸습니다.', 'error');
              setLoginPwdInput('');
            }
          };

          const handleChangePassword = () => {
            if (newPwdInput.trim().length < 4) return showToast('비밀번호는 최소 4자리 이상이어야 합니다.', 'error');
            setAdminPassword(newPwdInput.trim());
            localStorage.setItem('chess_admin_pwd', newPwdInput.trim());
            setIsPwdModalOpen(false);
            setNewPwdInput('');
            showToast('관리자 비밀번호가 성공적으로 변경되었습니다.');
          };

          const handleExport = () => {
            const backupData = { title: leagueTitle, players: basePlayers, matches: matches, exportDate: new Date().toISOString() };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `체스리그_백업.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            showToast('리그 데이터를 내보냈습니다.');
          };

          const handleImport = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (!data.players || !data.matches) return showToast('유효하지 않은 백업 파일입니다.', 'error');
                showConfirm('경고: 기존의 모든 데이터가 백업 파일로 덮어씌워집니다. 계속하시겠습니까?', () => {
                  setBasePlayers(data.players);
                  setMatches(data.matches);
                  if (data.title) setLeagueTitle(data.title);
                  showToast('데이터 불러오기가 완료되었습니다.');
                });
              } catch (err) { showToast('오류가 발생했습니다.', 'error'); }
            };
            reader.readAsText(file);
            e.target.value = '';
          };

          const handleSaveTitle = () => {
            if (!tempTitle.trim()) return setIsEditingTitle(false);
            setLeagueTitle(tempTitle.trim());
            setIsEditingTitle(false);
            showToast('리그 이름이 변경되었습니다.');
          };

          const currentPlayers = useMemo(() => calculateCurrentStats(basePlayers, matches), [basePlayers, matches]);

          const filteredMatches = useMemo(() => {
            return matches.filter(match => {
              let isDateValid = true;
              const matchDate = new Date(match.date).getTime();
              const today = new Date(); today.setHours(23, 59, 59, 999);
              const todayTime = today.getTime();
              const dayMs = 24 * 60 * 60 * 1000;
              
              if (filter.period !== '전체 기간') {
                let startLimit = 0;
                if (filter.period === '1주일') startLimit = todayTime - 7 * dayMs;
                else if (filter.period === '1개월') { const d = new Date(today); d.setMonth(d.getMonth() - 1); startLimit = d.getTime(); }
                else if (filter.period === '3개월') { const d = new Date(today); d.setMonth(d.getMonth() - 3); startLimit = d.getTime(); }
                else if (filter.period === '6개월') { const d = new Date(today); d.setMonth(d.getMonth() - 6); startLimit = d.getTime(); }
                else if (filter.period === '1년') { const d = new Date(today); d.setFullYear(d.getFullYear() - 1); startLimit = d.getTime(); }
                else if (filter.period === '직접 설정') {
                  const sDate = filter.startDate ? new Date(filter.startDate).getTime() : 0;
                  const eDateObj = filter.endDate ? new Date(filter.endDate) : new Date(8640000000000000);
                  if (filter.endDate) eDateObj.setHours(23, 59, 59, 999);
                  if (matchDate < sDate || matchDate > eDateObj.getTime()) isDateValid = false;
                }
                if (filter.period !== '직접 설정' && matchDate < startLimit) isDateValid = false;
              }
              return isDateValid && filter.types.includes(match.type) && (filter.whiteId ? match.whiteId === filter.whiteId : true) && (filter.blackId ? match.blackId === filter.blackId : true);
            });
          }, [matches, filter]);

          const resetFilter = () => setFilter({ period: '전체 기간', startDate: '', endDate: '', types: allMatchTypes, whiteId: '', blackId: '' });

          const selectedPlayerInfo = useMemo(() => {
            if (!infoTabPlayerId) return null;
            const player = currentPlayers.find(p => p.id === infoTabPlayerId);
            if (!player) return null;

            let startLimit = 0;
            const today = new Date(); today.setHours(23, 59, 59, 999);
            const dayMs = 24 * 60 * 60 * 1000;
            
            if (infoPeriod === '1주일') startLimit = today.getTime() - 7 * dayMs;
            else if (infoPeriod === '1개월') { const d = new Date(today); d.setMonth(d.getMonth() - 1); startLimit = d.getTime(); }
            else if (infoPeriod === '3개월') { const d = new Date(today); d.setMonth(d.getMonth() - 3); startLimit = d.getTime(); }
            else if (infoPeriod === '6개월') { const d = new Date(today); d.setMonth(d.getMonth() - 6); startLimit = d.getTime(); }
            else if (infoPeriod === '1년') { const d = new Date(today); d.setFullYear(d.getFullYear() - 1); startLimit = d.getTime(); }

            const allPlayerMatches = matches.filter(m => m.whiteId === infoTabPlayerId || m.blackId === infoTabPlayerId).sort((a,b) => a.timestamp - b.timestamp);
            const fullHistory = allPlayerMatches.length > 0 ? [{ date: '초기', rating: 1200, timestamp: player.createdAt || 0 }] : [];

            allPlayerMatches.forEach(m => {
                const isWhite = m.whiteId === infoTabPlayerId;
                fullHistory.push({ date: m.date, rating: isWhite ? m.log.whiteRatingBefore + m.log.whiteChange : m.log.blackRatingBefore + m.log.blackChange, timestamp: m.timestamp });
            });

            let chartHistory = fullHistory;
            if (infoPeriod !== '전체 기간') {
                const beforePeriod = fullHistory.filter(h => h.timestamp < startLimit);
                const withinPeriod = fullHistory.filter(h => h.timestamp >= startLimit);
                chartHistory = [];
                if (beforePeriod.length > 0 && withinPeriod.length > 0) chartHistory.push({ date: '시작점', rating: beforePeriod[beforePeriod.length - 1].rating });
                else if (withinPeriod.length > 0) chartHistory.push({ date: '초기', rating: 1200 }); 
                chartHistory = [...chartHistory, ...withinPeriod];
            }

            const minRating = chartHistory.length > 0 ? Math.min(...chartHistory.map(h => h.rating)) : 1200;
            const maxRating = chartHistory.length > 0 ? Math.max(...chartHistory.map(h => h.rating)) : 1200;

            const periodMatches = allPlayerMatches.filter(m => m.timestamp >= startLimit);
            const stats = { total: { w: 0, d: 0, l: 0 }, white: { w: 0, d: 0, l: 0 }, black: { w: 0, d: 0, l: 0 } };

            periodMatches.forEach(m => {
                const isWhite = m.whiteId === infoTabPlayerId;
                const res = m.result; 
                if (isWhite) { if (res === 1) { stats.total.w++; stats.white.w++; } else if (res === 0) { stats.total.l++; stats.white.l++; } else { stats.total.d++; stats.white.d++; } } 
                else { if (res === 0) { stats.total.w++; stats.black.w++; } else if (res === 1) { stats.total.l++; stats.black.l++; } else { stats.total.d++; stats.black.d++; } }
            });

            const calcWinRate = (s) => (s.w + s.d + s.l) > 0 ? ((s.w + s.d * 0.5) / (s.w + s.d + s.l) * 100).toFixed(1) : '0.0';

            return { 
              player, chartHistory, stats, periodMatchesCount: periodMatches.length, yDomain: [Math.max(0, minRating - 50), maxRating + 50],
              barData: [
                { rawName: '전체', name: `전체 (${calcWinRate(stats.total)}%)`, 승리: stats.total.w, 무승부: stats.total.d, 패배: stats.total.l, 승률: calcWinRate(stats.total) },
                { rawName: '백', name: `백 (${calcWinRate(stats.white)}%)`, 승리: stats.white.w, 무승부: stats.white.d, 패배: stats.white.l, 승률: calcWinRate(stats.white) },
                { rawName: '흑', name: `흑 (${calcWinRate(stats.black)}%)`, 승리: stats.black.w, 무승부: stats.black.d, 패배: stats.black.l, 승률: calcWinRate(stats.black) }
              ]
            };
          }, [infoTabPlayerId, currentPlayers, matches, infoPeriod]);

          const [newPlayer, setNewPlayer] = useState({ grade: '', classNum: '', name: '' });
          
          const handleAddPlayer = (e) => {
            e.preventDefault();
            if (!newPlayer.grade || !newPlayer.classNum || !newPlayer.name) return showToast('모든 정보를 입력해주세요.', 'error');
            
            const newId = formatId(basePlayers.length > 0 ? Math.max(...basePlayers.map(p => parseInt(p.id, 10))) + 1 : 1);
            setBasePlayers([...basePlayers, { id: newId, grade: newPlayer.grade, classNum: newPlayer.classNum, name: newPlayer.name.trim(), createdAt: Date.now() }]);
            setNewPlayer({ grade: '', classNum: '', name: '' });
            showToast(`선수 등록 완료: ${newPlayer.name} (${newId})`);
            if (gradeInputRef.current) gradeInputRef.current.focus();
          };

          const handleDeletePlayer = (id, name) => {
            if (matches.some(m => m.whiteId === id || m.blackId === id)) return showToast('경기 기록이 있는 선수는 삭제할 수 없습니다.', 'error');
            showConfirm(`${name} 선수를 정말 삭제하시겠습니까?`, () => {
              setBasePlayers(basePlayers.filter(p => p.id !== id));
              showToast(`${name} 선수가 삭제되었습니다.`);
            });
          };

          const [matchForm, setMatchForm] = useState({ date: new Date().toISOString().split('T')[0], type: '자유', whiteId: '', blackId: '', result: '1' });

          const handleAddMatch = () => {
            const { date, type, whiteId, blackId, result } = matchForm;
            if (!whiteId || !blackId) return showToast('백 선수와 흑 선수를 모두 선택해주세요.', 'error');
            if (whiteId === blackId) return showToast('백과 흑은 동일한 선수일 수 없습니다.', 'error');

            const numRes = parseFloat(result);
            const wPlayer = currentPlayers.find(p => p.id === whiteId);
            const bPlayer = currentPlayers.find(p => p.id === blackId);
            const expectedW = calculateExpected(wPlayer.rating, bPlayer.rating);
            const changeW = calculateEloChange(numRes, expectedW);

            setMatches([...matches, { id: `match_${Date.now()}`, timestamp: Date.now(), date, type, whiteId, blackId, result: numRes, log: { whiteRatingBefore: wPlayer.rating, blackRatingBefore: bPlayer.rating, whiteChange: changeW, blackChange: -changeW } }]);
            setMatchForm(prev => ({ ...prev, whiteId: '', blackId: '', result: '1' }));
            showToast('경기 기록이 추가되었습니다.');
          };

          const handleUndoLastMatch = () => {
            if (matches.length === 0) return showToast('삭제할 경기 기록이 없습니다.', 'error');
            showConfirm('가장 마지막 경기 기록을 취소하시겠습니까?', () => {
              const sortedMatches = [...matches].sort((a, b) => b.timestamp - a.timestamp);
              setMatches(matches.filter(m => m.id !== sortedMatches[0].id));
              showToast('마지막 경기 기록이 삭제되었습니다.');
            });
          };

          return (
            <div className="min-h-screen bg-[#f3f4f6] text-gray-800 font-sans p-4 md:p-8 relative">
              
              {/* 모드 전환 및 비밀번호 변경 버튼 (우측 상단 전체 화면 기준) */}
              <div className="absolute top-4 right-4 md:top-6 md:right-8 flex gap-2 z-40">
                {isAdmin && (
                  <button onClick={() => setIsPwdModalOpen(true)} className="bg-white text-gray-400 hover:text-blue-600 p-2.5 rounded-full shadow-sm hover:bg-gray-50 transition-colors border border-gray-200" title="비밀번호 변경">
                    <Icon name="key" size={18} />
                  </button>
                )}
                <button onClick={handleToggleAdmin} className={`shadow-sm p-2.5 rounded-full transition-colors flex items-center gap-1.5 px-4 font-bold text-sm border ${isAdmin ? 'bg-green-100 text-green-700 border-green-200 hover:bg-green-200' : 'bg-white text-gray-500 hover:bg-gray-100 border-gray-200'}`}>
                  {isAdmin ? <Icon name="unlock" size={16} /> : <Icon name="lock" size={16} />}
                  {isAdmin ? '관리자 모드' : '뷰어 모드'}
                </button>
              </div>

              {/* 토스트 알림 */}
              {toast && (
                <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg shadow-xl flex items-center gap-3 z-50 text-white transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>

                          <form onSubmit={handleAddPlayer} className="space-y-5">
                            <div><label className="block text-sm font-bold text-gray-700 mb-2">학년</label><input ref={gradeInputRef} type="number" className="w-full border rounded-lg p-3 outline-none" value={newPlayer.grade} onChange={(e) => setNewPlayer({...newPlayer, grade: e.target.value})} required /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-2">반</label><input type="number" className="w-full border rounded-lg p-3 outline-none" value={newPlayer.classNum} onChange={(e) => setNewPlayer({...newPlayer, classNum: e.target.value})} required /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-2">이름</label><input type="text" className="w-full border rounded-lg p-3 outline-none" value={newPlayer.name} onChange={(e) => setNewPlayer({...newPlayer, name: e.target.value})} required /></div>
                            <button type="submit" className="w-full bg-green-600 text-white font-bold py-3 rounded-lg mt-2">등록하기</button>
                          </form>
                        </div>
                      </div>
                      <div className="lg:col-span-2">
                        <h3 className="text-xl font-bold text-gray-800 mb-6">전체 선수 목록 ({basePlayers.length}명)</h3>
                        <div className="overflow-x-auto rounded-lg border shadow-sm h-[600px] overflow-y-auto">
                          <table className="min-w-full divide-y text-sm text-left">
                            <thead className="bg-gray-50 sticky top-0"><tr><th className="px-6 py-4">등록번호</th><th className="px-6 py-4">소속</th><th className="px-6 py-4">이름</th><th className="px-6 py-4 text-center">관리</th></tr></thead>
                            <tbody className="bg-white divide-y">
                              {basePlayers.slice().reverse().map(player => (
                                <tr key={player.id} className="hover:bg-gray-50"><td className="px-6 py-3 font-mono">{player.id}</td><td className="px-6 py-3">{player.grade}학년 {player.classNum}반</td><td className="px-6 py-3 font-bold">{player.name}</td><td className="px-6 py-3 text-center"><button onClick={() => handleDeletePlayer(player.id, player.name)} className="text-red-500 border border-red-500 px-3 py-1.5 rounded-md text-xs font-bold">삭제</button></td></tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'history' && (
                    <div>
                      <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">📖 경기 결과 타임라인</h2>
                        <div className="flex gap-2">
                          <button onClick={() => setShowFilter(!showFilter)} className="px-4 py-2 rounded-lg text-sm font-bold border flex items-center gap-2"><Icon name="filter" size={16} /> 필터</button>
                          {isAdmin && <button onClick={handleUndoLastMatch} disabled={matches.length === 0} className="text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2"><Icon name="trash" size={16} /> 마지막 취소</button>}
                        </div>
                      </div>
                      {showFilter && (
                        <div className="bg-white p-5 rounded-xl border mb-6">
                          <div className="flex justify-between items-center mb-4"><h3 className="font-bold">경기 검색 필터</h3><button onClick={resetFilter} className="text-sm text-blue-600">초기화</button></div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                              <label className="block text-sm font-bold mb-2">기간</label>
                              <select className="border rounded-md p-2 text-sm w-full mb-4" value={filter.period} onChange={(e) => setFilter({...filter, period: e.target.value})}><option value="전체 기간">전체 기간</option><option value="1개월">최근 1개월</option></select>
                              <label className="block text-sm font-bold mb-2">경기 유형</label>
                              <div className="flex flex-wrap gap-3">
                                {allMatchTypes.map(type => <label key={type} className="flex items-center gap-1 text-sm"><input type="checkbox" checked={filter.types.includes(type)} onChange={() => setFilter({...filter, types: filter.types.includes(type) ? filter.types.filter(t => t !== type) : [...filter.types, type]})} /> {type}</label>)}
                              </div>
                            </div>
                            <div className="space-y-4 bg-gray-50 p-4 rounded-lg border flex flex-col justify-center">
                              <FilterPlayerSelector label="백" players={currentPlayers} selectedId={filter.whiteId} onSelect={(id) => setFilter({...filter, whiteId: id})} />
                              <FilterPlayerSelector label="흑" players={currentPlayers} selectedId={filter.blackId} onSelect={(id) => setFilter({...filter, blackId: id})} />
                            </div>
                          </div>
                        </div>
                      )}
                      <div className="overflow-x-auto rounded-lg border shadow-sm">
                        <table className="min-w-full divide-y text-sm text-center">
                          <thead className="bg-gray-50"><tr><th className="px-4 py-4">No.</th><th className="px-4 py-4">일자</th><th className="px-4 py-4 bg-white">백</th><th className="px-4 py-4">결과</th><th className="px-4 py-4 bg-gray-800 text-white">흑</th></tr></thead>
                          <tbody className="bg-white divide-y">
                            {filteredMatches.slice().reverse().map((match, idx) => {
                              const w = currentPlayers.find(p => p.id === match.whiteId); const b = currentPlayers.find(p => p.id === match.blackId);
                              return (
                                <tr key={match.id} className="hover:bg-gray-50">
                                  <td className="px-4 py-4 text-gray-400">{filteredMatches.length - idx}</td>
                                  <td className="px-4 py-4"><div className="font-bold">{match.date}</div><div className="text-xs">{match.type}</div></td>
                                  <td className="px-4 py-4"><div className="font-bold text-lg">{w?.name}</div><div className="text-sm font-bold font-mono">{match.log.whiteChange > 0 ? '+' : ''}{match.log.whiteChange}</div></td>
                                  <td className="px-4 py-4 font-black bg-gray-50">{match.result === 1 ? <span className="text-blue-600">1 : 0</span> : match.result === 0 ? <span className="text-red-600">0 : 1</span> : <span className="text-gray-600">0.5 : 0.5</span>}</td>
                                  <td className="px-4 py-4 bg-gray-50"><div className="font-bold text-lg">{b?.name}</div><div className="text-sm font-bold font-mono">{match.log.blackChange > 0 ? '+' : ''}{match.log.blackChange}</div></td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </main>
              </div>

              {/* 하단 플로팅 버튼 (모든 사용자 공통) */}
              <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-40">
                <button onClick={() => setIsSyncModalOpen(true)} className="bg-blue-600 text-white shadow-xl px-5 py-3.5 rounded-full font-bold text-sm flex items-center justify-center gap-2.5 hover:bg-blue-700">
                  <Icon name="cloud" size={18} /> 클라우드 연동
                </button>
                
                {/* 관리자 전용: 백업/복원 버튼 */}
                {isAdmin && (
                  <>
                    <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImport} />
                    <button onClick={handleExport} className="bg-white text-gray-700 border shadow-xl px-5 py-3.5 rounded-full font-bold text-sm flex items-center justify-center gap-2.5 hover:bg-gray-50">
                      <Icon name="download" size={18} /> 내보내기
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="bg-gray-800 text-white shadow-xl px-5 py-3.5 rounded-full font-bold text-sm flex items-center justify-center gap-2.5 hover:bg-gray-700">
                      <Icon name="upload" size={18} /> 불러오기
                    </button>
                  </>
                )}
              </div>
              {/* 푸터 (저작권 및 제작 정보) */}
              <footer className="mt-12 mb-8 text-center text-xs text-gray-400">
                <p className="font-medium text-gray-500">
                  © 2026 Elo for school. Designed & Developed by <a href="https://celbeing.tistory.com/" target="_blank" rel="noopener noreferrer" className="text-gray-700 font-semibold hover:text-blue-600 hover:underline transition-colors">전라남도교육지원청</a>
                </p>
                <p className="mt-1 text-[11px] text-gray-400 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                  <span>Powered by React & Google Apps Script</span>
                  <span className="hidden md:inline">•</span>
                  <span className="inline-flex items-center gap-1">
                    <i className="fa-solid fa-wand-magic-sparkles text-indigo-400 text-[10px]"></i>
                    Assisted by Google Gemini
                  </span>
                </p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
